name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: NPM version
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Build Notely
        run: npm run build
      
